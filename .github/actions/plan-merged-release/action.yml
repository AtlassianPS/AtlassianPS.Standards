name: Plan Merged Release
description: Reconcile merged pull request intent since the latest release tag and compute the next release tag.
inputs:
  commit-sha:
    description: Master commit SHA through which release intent is reconciled. Defaults to github.sha.
    required: false
  release-impact:
    description: Optional manual release impact for releasing unreleased changes already on the checked-out branch.
    required: false
outputs:
  should_release:
    description: Whether pending merged changes require a release.
    value: ${{ steps.plan.outputs.should_release }}
  release_tag:
    description: Computed v-prefixed release tag.
    value: ${{ steps.plan.outputs.release_tag }}
runs:
  using: composite
  steps:
    - name: Plan merged release
      id: plan
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        COMMIT_SHA: ${{ inputs.commit-sha || github.sha }}
        RELEASE_IMPACT: ${{ inputs.release-impact }}
      run: ${{ github.action_path }}/plan-merged-release.ps1
