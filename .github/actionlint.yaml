paths:
  .github/workflows/module_ci.yml:
    ignore:
      # Same reusable-workflow identity fields as the release workflow.
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/module_release.yml:
    ignore:
      # actionlint 1.7.12 does not yet model GitHub's reusable-workflow identity fields.
      - 'property "workflow_(repository|sha)" is not defined in object type'
