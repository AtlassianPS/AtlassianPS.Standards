name: Module Release

on:
  workflow_call:
    inputs:
      module-name:
        description: PowerShell module and repository name.
        required: true
        type: string
      notify-homepage:
        description: Notify AtlassianPS.github.io after publication.
        required: false
        default: true
        type: boolean
      release-impact:
        description: Optional impact selected by a manual release dispatch.
        required: false
        default: ''
        type: string
      release-channel:
        description: Explicit stable, alpha, or beta channel; candidates require manual dispatch.
        required: false
        default: stable
        type: string
      prerelease-branch:
        description: Optional repository branch to package for alpha/beta; dispatch still runs from master.
        required: false
        default: ''
        type: string
      major-authorization:
        description: Fresh human confirmation formatted as owner/repository vMAJOR.
        required: false
        default: ''
        type: string
      build-profile:
        description: Shared module CI build contract used for candidates.
        required: false
        default: standard
        type: string
      smoke-profile:
        description: Shared module CI smoke tests used for candidates.
        required: false
        default: none
        type: string
      exclude-documentation-tests:
        required: false
        default: false
        type: boolean
    secrets:
      ATLASSIANPS_RELEASE_APP_PRIVATE_KEY:
        required: true
      PSGALLERY_API_KEY:
        required: true
      HOMEPAGE_PAT:
        required: false
      ATLASSIAN_CLOUD_PAT:
        required: false

concurrency:
  group: continuous-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    permissions:
      contents: read
      issues: read
      pull-requests: read
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Prepare v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    outputs:
      release-tag: ${{ steps.plan.outputs.release_tag }}
      source-commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Checkout module repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || 'master' }}

      - name: Resolve prerelease source
        id: source
        shell: pwsh
        env:
          PRERELEASE_BRANCH: ${{ inputs.prerelease-branch }}
          RELEASE_CHANNEL: ${{ inputs.release-channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRef = 'HEAD'
          if ($env:PRERELEASE_BRANCH) {
            if ($env:RELEASE_CHANNEL -cnotin @('alpha', 'beta')) {
              throw 'prerelease-branch requires the alpha or beta channel.'
            }
            git check-ref-format "refs/heads/$env:PRERELEASE_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw 'Invalid prerelease branch name.' }
            $sourceRef = "refs/remotes/origin/$env:PRERELEASE_BRANCH"
          }
          $sourceCommit = git rev-parse --verify --quiet "$sourceRef^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve prerelease branch '$env:PRERELEASE_BRANCH'." }
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT

      - name: Checkout release workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-workflow
          persist-credentials: false

      - uses: ./.release-workflow/.github/actions/plan-merged-release
        id: plan
        with:
          commit-sha: ${{ github.event.workflow_run.head_sha }}
          release-impact: ${{ inputs.release-impact }}
          release-channel: ${{ github.event_name == 'workflow_dispatch' && inputs.release-channel || 'stable' }}
          major-authorization: ${{ inputs.major-authorization }}

      - uses: ./.release-workflow/.github/actions/prepare-release-changelog
        if: steps.plan.outputs.should_release == 'true' && inputs.release-channel == 'stable'
        with:
          release-version: ${{ steps.plan.outputs.release_tag }}

      - uses: ./.release-workflow/.github/actions/setup-powershell
        if: steps.plan.outputs.should_release == 'true' && inputs.release-channel == 'stable'

      - name: Stamp source manifest version
        if: steps.plan.outputs.should_release == 'true' && inputs.release-channel == 'stable'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
        run: Invoke-Build -Task SetSourceVersion -VersionToPublish $env:RELEASE_TAG

      - name: Create release app token
        if: steps.plan.outputs.should_release == 'true' && inputs.release-channel == 'stable'
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ATLASSIANPS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLASSIANPS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: ./.release-workflow/.github/actions/commit-release-metadata
        if: steps.plan.outputs.should_release == 'true' && inputs.release-channel == 'stable'
        with:
          release-tag: ${{ steps.plan.outputs.release_tag }}
          manifest-path: ${{ inputs.module-name }}/${{ inputs.module-name }}.psd1
          release-bot-token: ${{ steps.release_app.outputs.token }}

  candidate_ci:
    name: Validate alpha or beta
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.release-channel != 'stable' && needs.prepare.outputs.release-tag != ''
    uses: ./.github/workflows/module_ci.yml
    with:
      detect-changes: false
      build-profile: ${{ inputs.build-profile }}
      smoke-profile: ${{ inputs.smoke-profile }}
      exclude-documentation-tests: ${{ inputs.exclude-documentation-tests }}
      planned-release-version: ${{ needs.prepare.outputs.release-tag }}
      source-commit: ${{ needs.prepare.outputs.source-commit }}
      module-name: ${{ inputs.module-name }}
    secrets:
      ATLASSIAN_CLOUD_PAT: ${{ secrets.ATLASSIAN_CLOUD_PAT }}

  publish:
    name: Publish tested release artifact
    permissions:
      actions: read
      contents: read
    needs: [prepare, candidate_ci]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
      inputs.release-channel != 'stable' &&
      needs.prepare.result == 'success' &&
      needs.candidate_ci.result == 'success') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Prepare v') &&
      github.event.workflow_run.actor.login == 'atlassianps-release-bot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Resolve prepared release
        id: prepared_release
        shell: pwsh
        env:
          PREPARED_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          PLANNED_CANDIDATE: ${{ needs.prepare.outputs.release-tag }}
        run: |
          if ($env:PLANNED_CANDIDATE) {
            "release_tag=$env:PLANNED_CANDIDATE" >> $env:GITHUB_OUTPUT
            return
          }
          $message = $env:PREPARED_COMMIT_MESSAGE
          if ($message -notmatch '^Prepare (?<tag>v\d+\.\d+\.\d+) release$') {
            throw "Commit message '$message' is not a release metadata commit."
          }

          "release_tag=$($Matches.tag)" >> $env:GITHUB_OUTPUT

      - name: Download tested release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: Release
          path: ./Release/
          digest-mismatch: error

      - name: Create release app token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ATLASSIANPS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLASSIANPS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Create annotated release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_TAG: ${{ steps.prepared_release.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || needs.prepare.outputs.source-commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          if ($env:RELEASE_TAG.Contains('-')) {
            $ledger = Get-Content ./Release/candidate-ledger.json -Raw | ConvertFrom-Json
            if ($ledger.SourceCommit -cne $env:RELEASE_COMMIT) {
              throw 'Candidate source commit differs from the planned release tag target.'
            }
          }

          $refs = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG" | ConvertFrom-Json)
          $existing = $refs | Where-Object { $_.ref -eq "refs/tags/$env:RELEASE_TAG" } | Select-Object -First 1
          if ($existing) {
            if ($existing.object.type -ne 'tag') {
              throw "Release tag '$env:RELEASE_TAG' must be annotated."
            }
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($existing.object.sha)" | ConvertFrom-Json
            if ($tagObject.object.type -ne 'commit' -or $tagObject.object.sha -ne $env:RELEASE_COMMIT) {
              throw "Release tag '$env:RELEASE_TAG' does not identify '$env:RELEASE_COMMIT'."
            }
            Write-Host "Release tag '$env:RELEASE_TAG' already identifies the tested candidate."
            return
          }

          $tagObjectSha = gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/tags" -f tag="$env:RELEASE_TAG" -f message="$env:RELEASE_TAG" -f object="$env:RELEASE_COMMIT" -f type=commit --jq .sha
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:RELEASE_TAG" -f sha="$tagObjectSha" | Out-Null

      - name: Publish tested module artifact
        shell: pwsh
        env:
          MODULE_NAME: ${{ inputs.module-name }}
          RELEASE_TAG: ${{ steps.prepared_release.outputs.release_tag }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $expectedGalleryVersion = $env:RELEASE_TAG.Substring(1)
          $lookup = @{ Name = $env:MODULE_NAME; RequiredVersion = $expectedGalleryVersion; Repository = 'PSGallery'; ErrorAction = 'SilentlyContinue' }
          if ($expectedGalleryVersion.Contains('-')) { $lookup.AllowPrerelease = $true }
          $published = Find-Module @lookup
          if ($published) {
            Write-Host "PSGallery already contains $env:MODULE_NAME $expectedGalleryVersion; skipping immutable publish."
            return
          }

          $modulePath = Join-Path ./Release $env:MODULE_NAME
          $manifest = Import-PowerShellDataFile (Join-Path $modulePath "$env:MODULE_NAME.psd1")
          $fullVersion = [String]$manifest.ModuleVersion
          if ($manifest.PrivateData.PSData.Prerelease) { $fullVersion += '-' + $manifest.PrivateData.PSData.Prerelease }
          if ($fullVersion -cne $expectedGalleryVersion) { throw 'Downloaded manifest full version differs from the planned release.' }
          if ($expectedGalleryVersion.Contains('-')) {
            $ledger = Get-Content ./Release/candidate-ledger.json -Raw | ConvertFrom-Json
            if ($ledger.FullVersion -cne $expectedGalleryVersion -or $ledger.ModuleName -cne $env:MODULE_NAME -or
                (Get-FileHash "./Release/$env:MODULE_NAME.zip" -Algorithm SHA256).Hash -cne $ledger.PackageSha256) {
              throw 'Downloaded candidate artifact differs from its verification ledger.'
            }
          }
          foreach ($dependency in @($manifest.RequiredModules)) {
            $installParameters = @{
              Repository   = 'PSGallery'
              Scope        = 'CurrentUser'
              Force        = $true
              AllowClobber = $true
              ErrorAction  = 'Stop'
            }
            if ($dependency -is [String]) {
              $installParameters.Name = $dependency
            }
            else {
              $installParameters.Name = $dependency.ModuleName
              if ($dependency.RequiredVersion) {
                $installParameters.RequiredVersion = $dependency.RequiredVersion
              }
              else {
                if ($dependency.ModuleVersion) {
                  $installParameters.MinimumVersion = $dependency.ModuleVersion
                }
                if ($dependency.MaximumVersion) {
                  $installParameters.MaximumVersion = $dependency.MaximumVersion
                }
              }
            }
            Install-Module @installParameters
          }

          Publish-Module -Path $modulePath -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.release_app.outputs.token }}
          tag_name: ${{ steps.prepared_release.outputs.release_tag }}
          body_path: ./Release/release-notes.md
          files: |
            ./Release/${{ inputs.module-name }}.zip
            ${{ github.event_name == 'workflow_dispatch' && inputs.release-channel != 'stable' && './Release/candidate-ledger.json' || '' }}
          fail_on_unmatched_files: true
          prerelease: ${{ inputs.release-channel != 'stable' && github.event_name == 'workflow_dispatch' }}

      - name: Notify homepage to update submodule
        if: inputs.notify-homepage && (github.event_name != 'workflow_dispatch' || inputs.release-channel == 'stable')
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEPAGE_PAT }}
          repository: AtlassianPS/AtlassianPS.github.io
          event-type: module-release
          client-payload: >-
            {"module":"${{ inputs.module-name }}","version":"${{ steps.prepared_release.outputs.release_tag }}"}

  verify_gallery:
    name: Verify candidate Gallery acquisition (${{ matrix.shell }})
    needs: [prepare, publish]
    if: github.event_name == 'workflow_dispatch' && inputs.release-channel != 'stable'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      ACQUISITION_SHELL: ${{ matrix.shell }}
      MODULE_NAME: ${{ inputs.module-name }}
      CANDIDATE_VERSION: ${{ needs.prepare.outputs.release-tag }}
    steps:
      - name: Checkout shared acquisition checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Bootstrap Windows PowerShell package provider
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          Install-Module PowerShellGet -RequiredVersion 2.2.5 -Scope CurrentUser -Force -AllowClobber

      - name: Acquire and load the exact published candidate
        shell: pwsh
        run: |
          & $env:ACQUISITION_SHELL -NoLogo -NonInteractive -NoProfile -File ./Tools/Test-CandidateAcquisition.ps1 -ModuleName $env:MODULE_NAME -RequiredVersion $env:CANDIDATE_VERSION.Substring(1)
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate acquisition failed.' }

      - name: Verify normal acquisition still selects stable
        shell: pwsh
        run: |
          & $env:ACQUISITION_SHELL -NoLogo -NonInteractive -NoProfile -File ./Tools/Test-CandidateAcquisition.ps1 -StableModuleName $env:MODULE_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Stable acquisition failed.' }
