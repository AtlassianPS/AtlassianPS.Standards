name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Release impact for the changes being packaged
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_channel:
        description: Stable release or an immutable alpha/beta candidate
        required: true
        default: stable
        type: choice
        options: [stable, alpha, beta]
      prerelease_branch:
        description: Optional source branch for alpha/beta (empty uses master)
        required: false
        type: string
      major_authorization:
        description: Fresh major authorization as owner/repository vMAJOR
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    uses: ./.github/workflows/module_release.yml
    with:
      module-name: AtlassianPS.Standards
      notify-homepage: false
      release-impact: ${{ inputs.release_impact }}
      release-channel: ${{ inputs.release_channel || 'stable' }}
      prerelease-branch: ${{ inputs.prerelease_branch }}
      major-authorization: ${{ inputs.major_authorization }}
    secrets: inherit
