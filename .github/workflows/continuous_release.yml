name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Release impact for unreleased changes already on master
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: Optional prerelease label for unreleased changes already on master, for example alpha, beta, rc, or rc-2
        required: false
        type: string

concurrency:
  group: continuous-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare release metadata
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Prepare v'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/plan-merged-release
        id: plan
        with:
          commit-sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          release-impact: ${{ github.event_name == 'workflow_dispatch' && inputs.release_impact || '' }}
          prerelease-label: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || '' }}

      - uses: ./.github/actions/prepare-release-changelog
        if: steps.plan.outputs.should_release == 'true'
        with:
          release-version: ${{ steps.plan.outputs.release_tag }}

      - uses: ./.github/actions/setup-powershell
        if: steps.plan.outputs.should_release == 'true'

      - name: Stamp source manifest version
        if: steps.plan.outputs.should_release == 'true'
        run: Invoke-Build -Task SetSourceVersion -VersionToPublish ${{ steps.plan.outputs.release_tag }}
        shell: pwsh

      - name: Create release app token
        if: steps.plan.outputs.should_release == 'true'
        id: release_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ATLASSIANPS_RELEASE_APP_ID }}
          private-key: ${{ secrets.ATLASSIANPS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AtlassianPS.Standards

      - uses: ./.github/actions/commit-release-metadata
        if: steps.plan.outputs.should_release == 'true'
        with:
          release-tag: ${{ steps.plan.outputs.release_tag }}
          manifest-path: AtlassianPS.Standards/AtlassianPS.Standards.psd1
          release-bot-token: ${{ steps.release_app.outputs.token }}

  publish:
    name: Publish tested release artifact
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Prepare v') &&
      github.event.workflow_run.head_commit.author.name == 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve prepared release
        id: prepared_release
        shell: pwsh
        env:
          PREPARED_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          $message = $env:PREPARED_COMMIT_MESSAGE
          if ($message -notmatch '^Prepare (?<tag>v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)(?:-\d+)?)?) release$') {
            throw "Commit message '$message' is not a release metadata commit."
          }

          $releaseTag = $Matches.tag
          $releaseVersion = $releaseTag.Substring(1)
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_commit=${{ github.event.workflow_run.head_sha }}" >> $env:GITHUB_OUTPUT
          "package_path=./Release/AtlassianPS.Standards.zip" >> $env:GITHUB_OUTPUT
          "gallery_package_path=./Release/AtlassianPS.Standards.$releaseVersion.nupkg" >> $env:GITHUB_OUTPUT
          "release_notes_path=./Release/release-notes.md" >> $env:GITHUB_OUTPUT

      - name: Download tested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: Release-Candidate
          path: ./Release/
          digest-mismatch: error

      - name: Create release app token
        id: release_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ATLASSIANPS_RELEASE_APP_ID }}
          private-key: ${{ secrets.ATLASSIANPS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AtlassianPS.Standards

      - name: Create annotated release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_TAG: ${{ steps.prepared_release.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.prepared_release.outputs.release_commit }}
        run: |
          $refs = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG" | ConvertFrom-Json)
          $existing = @($refs | Where-Object { $_.ref -eq "refs/tags/$env:RELEASE_TAG" })
          if ($existing.Count -gt 1) {
            throw "Multiple refs matched release tag '$env:RELEASE_TAG'."
          }
          if ($existing.Count -eq 1) {
            if ($existing[0].object.type -ne 'tag') {
              throw "Release tag '$env:RELEASE_TAG' must be annotated."
            }
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($existing[0].object.sha)" | ConvertFrom-Json
            if ($tagObject.object.type -ne 'commit' -or $tagObject.object.sha -ne $env:RELEASE_COMMIT) {
              throw "Release tag '$env:RELEASE_TAG' does not identify '$env:RELEASE_COMMIT'."
            }
            Write-Host "Release tag '$env:RELEASE_TAG' already identifies the tested candidate."
            return
          }

          $tagObjectSha = gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/tags" -f tag="$env:RELEASE_TAG" -f message="$env:RELEASE_TAG" -f object="$env:RELEASE_COMMIT" -f type=commit --jq .sha
          gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:RELEASE_TAG" -f sha="$tagObjectSha" | Out-Null

      - name: Publish tested module artifact
        env:
          GALLERY_PACKAGE_PATH: ${{ steps.prepared_release.outputs.gallery_package_path }}
          RELEASE_TAG: ${{ steps.prepared_release.outputs.release_tag }}
        run: |
          $expectedGalleryVersion = $env:RELEASE_TAG.Substring(1)
          $published = Find-PSResource -Name 'AtlassianPS.Standards' -Version $expectedGalleryVersion -Prerelease -ErrorAction SilentlyContinue |
            Where-Object { $_.Version.ToString() -eq $expectedGalleryVersion } |
            Select-Object -First 1
          if ($published) {
            Write-Host "PSGallery already contains AtlassianPS.Standards $expectedGalleryVersion; skipping immutable publish."
            return
          }
          Publish-PSResource -NupkgPath $env:GALLERY_PACKAGE_PATH -Repository PSGallery -ApiKey ${{ secrets.PSGALLERY_API_KEY }} -ErrorAction Stop
        shell: pwsh

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.prepared_release.outputs.release_tag }}
          name: ${{ steps.prepared_release.outputs.release_tag }}
          body_path: ${{ steps.prepared_release.outputs.release_notes_path }}
          files: ${{ steps.prepared_release.outputs.package_path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.prepared_release.outputs.release_tag, '-alpha') || contains(steps.prepared_release.outputs.release_tag, '-beta') || contains(steps.prepared_release.outputs.release_tag, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ steps.release_app.outputs.token }}

      - name: Notify homepage to update submodule
        if: ${{ !contains(steps.prepared_release.outputs.release_tag, '-alpha') && !contains(steps.prepared_release.outputs.release_tag, '-beta') && !contains(steps.prepared_release.outputs.release_tag, '-rc') }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.HOMEPAGE_PAT }}
          repository: AtlassianPS/AtlassianPS.github.io
          event-type: module-release
          client-payload: '{"module": "AtlassianPS.Standards", "version": "${{ steps.prepared_release.outputs.release_tag }}"}'
