name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "CHANGELOG.md"
      - "LICENSE"
      # AI assistant instruction files
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursor/**"
      - ".github/copilot-instructions.md"
      - ".github/ai-context/**"
      - ".github/instructions/**"
      # GitHub/editor meta files
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".vscode/**"
      - ".editorconfig"
      - ".spelling"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-powershell

      - run: Invoke-Build -Task Lint
        shell: pwsh

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-powershell

      - run: Invoke-Build -File ./AtlassianPS.Standards.build.ps1 -Task Build
        shell: pwsh

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Release-Build
          path: ./Release/

  test_windows_ps5:
    name: Test (Windows PS5)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-powershell
        with:
          ps-version: "5"
          # Setup is run below in the powershell (PS 5.1) shell instead of pwsh,
          # so the Windows PowerShell module path is populated.
          skip-setup: "true"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Release-Build
          path: ./Release/

      - name: Setup
        shell: powershell
        run: |
          ./Tools/setup.ps1
          Invoke-Build -Task ShowDebugInfo

      - run: Invoke-Build -Task Test
        shell: powershell

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: Windows-PS5-Unit-Tests
          path: Test*.xml

  test_pwsh:
    name: Test (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: "Windows PS7" }
          - { os: ubuntu-latest, name: "Ubuntu" }
          - { os: macos-latest, name: "macOS" }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-powershell

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Release-Build
          path: ./Release/

      - run: Invoke-Build -Task Test
        shell: pwsh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.name }}-Unit-Tests
          path: Test*.xml

  release_candidate:
    name: Release Candidate
    needs: [build, test_windows_ps5, test_pwsh]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release candidate
        id: candidate
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $shouldBuild = $env:EVENT_NAME -eq 'push' -and
            $env:EVENT_REF -eq 'refs/heads/master' -and
            $env:COMMIT_MESSAGE -match '^Prepare (?<tag>v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)(?:-\d+)?)?) release$'

          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($shouldBuild) {
            "release_tag=$($Matches.tag)" >> $env:GITHUB_OUTPUT
          }

      - name: No release candidate required
        if: steps.candidate.outputs.should_build != 'true'
        run: echo "This CI run does not prepare a release candidate."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: steps.candidate.outputs.should_build == 'true'

      - uses: ./.github/actions/setup-powershell
        if: steps.candidate.outputs.should_build == 'true'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.candidate.outputs.should_build == 'true'
        with:
          name: Release-Build
          path: ./Release/

      - uses: ./.github/actions/build-release-notes
        if: steps.candidate.outputs.should_build == 'true'
        id: release_notes
        with:
          release-version: ${{ steps.candidate.outputs.release_tag }}
          module-path: ./AtlassianPS.Standards/AtlassianPS.Standards.psd1

      - name: Stamp release artifact
        if: steps.candidate.outputs.should_build == 'true'
        run: Invoke-Build -Task SetVersion -VersionToPublish ${{ steps.candidate.outputs.release_tag }} -VerifyPublishedRelease
        shell: pwsh

      - name: Package and verify release artifact
        if: steps.candidate.outputs.should_build == 'true'
        run: Invoke-Build -Task VerifyReleaseArtifact -VersionToPublish ${{ steps.candidate.outputs.release_tag }}
        shell: pwsh

      - name: Record candidate identity
        if: steps.candidate.outputs.should_build == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.release_notes_path }}
        run: |
          $packagePath = './Release/AtlassianPS.Standards.zip'
          $notesPath = (Resolve-Path -LiteralPath $env:RELEASE_NOTES_PATH).ProviderPath
          $expectedNotesPath = (Resolve-Path -LiteralPath './Release/release-notes.md').ProviderPath
          if ($notesPath -ne $expectedNotesPath) {
            throw "Release notes must be written to '$expectedNotesPath'."
          }
          $galleryPackages = @(Get-ChildItem -LiteralPath './Release' -Filter '*.nupkg')
          if ($galleryPackages.Count -ne 1) {
            throw "Expected one PSGallery package, found $($galleryPackages.Count)."
          }
          $galleryPackagePath = $galleryPackages[0].FullName

          $candidate = [ordered]@{
            schemaVersion      = 1
            releaseTag        = $env:RELEASE_TAG
            releaseCommit     = $env:GITHUB_SHA
            moduleName        = 'AtlassianPS.Standards'
            packageFile       = 'AtlassianPS.Standards.zip'
            packageSha256     = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
            galleryPackageFile = Split-Path -Path $galleryPackagePath -Leaf
            galleryPackageSha256 = (Get-FileHash -LiteralPath $galleryPackagePath -Algorithm SHA256).Hash.ToLowerInvariant()
            releaseNotesFile  = 'release-notes.md'
            releaseNotesSha256 = (Get-FileHash -LiteralPath $notesPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $candidate | ConvertTo-Json | Set-Content -LiteralPath './Release/release-manifest.json' -Encoding utf8

      - name: Upload release candidate
        if: steps.candidate.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Release-Candidate
          path: |
            ./Release/AtlassianPS.Standards.zip
            ./Release/*.nupkg
            ./Release/release-notes.md
            ./Release/release-manifest.json
          retention-days: 30

  ci-required:
    name: CI Result
    if: always()
    needs: [lint, build, test_windows_ps5, test_pwsh, release_candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        shell: bash
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results:"
          echo "$results"
          if echo "$results" | grep -E '"result":[[:space:]]*"(failure|cancelled|skipped)"' > /dev/null; then
            echo "::error::One or more required jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "All required jobs passed."
